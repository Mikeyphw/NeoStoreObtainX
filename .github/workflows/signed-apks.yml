name: NeoStoreObtainX Signed APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nsox-sign-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed:
    if: github.repository == 'Mikeyphw/NeoStoreObtainX' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Build and verify both signed APKs
    runs-on: ubuntu-latest
    environment: apk-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android tooling
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test without signing credentials
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: Sign and verify both variants
        shell: bash
        env:
          NSOX_KEYSTORE_B64: ${{ secrets.NSOX_KEYSTORE_B64 }}
          NSOX_STORE_PASSWORD: ${{ secrets.NSOX_STORE_PASSWORD }}
          NSOX_SIGNER_SHA256: ${{ vars.NSOX_SIGNER_SHA256 }}
        run: bash scripts/sign-apks.sh
      - name: Publish verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nsox-signed-debug-${{ github.run_attempt }}
          path: signed/debug/*
          if-no-files-found: error
      - name: Publish verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: nsox-signed-release-${{ github.run_attempt }}
          path: signed/release/*
          if-no-files-found: error
