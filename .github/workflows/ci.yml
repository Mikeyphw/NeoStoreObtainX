name: NeoStoreObtainX CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Structural bootstrap tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  android:
    name: Android compile, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 requested the retired SDK `tools` package and failed before Gradle ran.
      # v4 removes `tools` from its defaults; install only supported packages.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, unit tests, lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: neostore-obtainx-bootstrap-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
